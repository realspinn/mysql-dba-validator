name: Windows portable release

# Builds MySQL-DBA-Validator-v<version>-windows-x64.zip, smoke-tests the built
# artifact, and (for v* tags) attaches it to a DRAFT GitHub Release. A maintainer
# reviews and publishes the draft by hand.
#
# windows-x64 installs dependencies, runs the tests and builds with a read-only
# token. Only draft-release can write releases: it checks out nothing, runs no
# repository code, and checks the tested zip and its .sha256 before creating the
# draft.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.14"
          architecture: x64

      - name: Tag matches backend/version.py
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $version = python -c "import sys; sys.path.insert(0, 'backend'); import version; print(version.APP_VERSION)"
          if ("v$version" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} does not match APP_VERSION $version" }

      # pwsh does not stop when a program fails; only the last exit code fails the
      # step, so every earlier command is checked.
      - name: Test suite
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pytest -q
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip check

      - name: Build portable release
        run: python release/build_windows.py

      - name: Smoke-test the built artifact
        run: python release/smoke_test_artifact.py (Get-ChildItem dist/*.zip).FullName

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-portable
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

      # Diagnostics only. On failure, record file names, sizes, SHA256 hashes and
      # the audit output, never the failed binaries. The audit never prints
      # secret values. The job still fails and no release is created.
      - name: Write failure manifest
        if: failure()
        run: |
          New-Item -ItemType Directory -Force diagnostics | Out-Null
          if (Test-Path dist) {
            Get-ChildItem dist -Recurse -File | ForEach-Object {
              "{0}`t{1}`t{2}" -f (Resolve-Path -Relative $_.FullName), $_.Length, (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            } | Set-Content diagnostics/manifest.tsv -Encoding utf8
            $py = "build/release/venv/Scripts/python.exe"
            $app = Get-ChildItem dist -Directory | Select-Object -First 1
            if ((Test-Path $py) -and $app) { & $py release/audit_artifact.py $app.FullName *> diagnostics/audit.txt }
          } else {
            "no dist/ folder was produced" | Set-Content diagnostics/manifest.tsv -Encoding utf8
          }
          $warn = "build/release/work/mysql-dba-validator/warn-mysql-dba-validator.txt"
          if (Test-Path $warn) { Copy-Item $warn diagnostics/ }
          exit 0

      - name: Upload failure manifest
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: FAILED-build-manifest
          path: diagnostics/
          if-no-files-found: ignore
          retention-days: 7

  draft-release:
    # Runs only after windows-x64 passed (tests, build, audit, smoke test), on exactly
    # its artifact. The downloaded files are data: they are checked, never run, and
    # every name used comes from the tag.
    needs: windows-x64
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: windows-x64-portable
          path: windows-release

      - name: Check the zip and its checksum, then create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          zip="MySQL-DBA-Validator-${TAG}-windows-x64.zip"
          cd windows-release
          # Exactly this tag's zip and its checksum: nothing missing, nothing extra.
          test "$(ls -A | LC_ALL=C sort)" = "$(printf '%s\n' "$zip" "$zip.sha256")"
          test -f "$zip"
          test ! -L "$zip"
          test -f "$zip.sha256"
          test ! -L "$zip.sha256"
          # Byte for byte "<64 lowercase hex>  <zip name>\n": one line, LF only, this zip's hash.
          printf '%s  %s\n' "$(shasum -a 256 "$zip" | cut -d ' ' -f 1)" "$zip" | cmp -s - "$zip.sha256"
          shasum -a 256 -c "$zip.sha256"
          unzip -tqq "$zip"
          # Never creates a draft over an existing release; no asset is replaced.
          gh release create "$TAG" "$zip" "$zip.sha256" --draft --title "MySQL DBA Validator $TAG" --notes "Windows x64 portable ZIP (no installer). Verify with the .sha256 file. See README for scope and verification status."
