name: Windows portable release

# Builds MySQL-DBA-Validator-v<version>-windows-x64.zip, smoke-tests the built
# artifact, and (for v* tags) attaches it to a DRAFT GitHub Release. A maintainer
# reviews and publishes the draft by hand.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          architecture: x64

      - name: Tag matches backend/version.py
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $version = python -c "import sys; sys.path.insert(0, 'backend'); import version; print(version.APP_VERSION)"
          if ("v$version" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} does not match APP_VERSION $version" }

      # pwsh does not stop when a program fails; only the last exit code fails the
      # step, so every earlier command is checked.
      - name: Test suite
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pytest -q
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip check

      - name: Build portable release
        run: python release/build_windows.py

      - name: Smoke-test the built artifact
        run: python release/smoke_test_artifact.py (Get-ChildItem dist/*.zip).FullName

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-portable
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

      # Diagnostics only. On failure, record file names, sizes, SHA256 hashes and
      # the audit output, never the failed binaries. The audit never prints
      # secret values. The job still fails and no release is created.
      - name: Write failure manifest
        if: failure()
        run: |
          New-Item -ItemType Directory -Force diagnostics | Out-Null
          if (Test-Path dist) {
            Get-ChildItem dist -Recurse -File | ForEach-Object {
              "{0}`t{1}`t{2}" -f (Resolve-Path -Relative $_.FullName), $_.Length, (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            } | Set-Content diagnostics/manifest.tsv -Encoding utf8
            $py = "build/release/venv/Scripts/python.exe"
            $app = Get-ChildItem dist -Directory | Select-Object -First 1
            if ((Test-Path $py) -and $app) { & $py release/audit_artifact.py $app.FullName *> diagnostics/audit.txt }
          } else {
            "no dist/ folder was produced" | Set-Content diagnostics/manifest.tsv -Encoding utf8
          }
          $warn = "build/release/work/mysql-dba-validator/warn-mysql-dba-validator.txt"
          if (Test-Path $warn) { Copy-Item $warn diagnostics/ }
          exit 0

      - name: Upload failure manifest
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: FAILED-build-manifest
          path: diagnostics/
          if-no-files-found: ignore
          retention-days: 7

      - name: Create draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = (Get-ChildItem dist/*.zip, dist/*.sha256).FullName
          gh release create "${{ github.ref_name }}" @files --draft --title "MySQL DBA Validator ${{ github.ref_name }}" --notes "Windows x64 portable ZIP (no installer). Verify with the .sha256 file. See README for scope and verification status."
