name: Package check

# Builds the real Windows portable zip and the unsigned macOS app for every pull
# request to main, with the same scripts the release workflows use, and starts the
# packaged executables with the existing smoke tests. A change that passes the
# Python tests but breaks the packaged app fails here, before a release tag.
#
# Validation only: read-only token, no secrets, no environment, no signing,
# notarization, release or upload. The release workflows (release-windows.yml,
# release-macos.yml) stay the only place a release is built for publishing.
# Not a required check. tests/test_release_packaging.py checks these guarantees.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    name: Package (windows-x64)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.14"
          architecture: x64

      # The smoke test writes its registry fixture with the source tree's connector code.
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Build portable release
        run: python release/build_windows.py

      - name: Smoke-test the built artifact
        run: python release/smoke_test_artifact.py (Get-ChildItem dist/*.zip).FullName

  macos:
    name: Package (macos-arm64-unsigned)
    runs-on: macos-15            # GitHub-hosted, Apple Silicon (arm64)
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.14"
          architecture: arm64

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Build and audit the unsigned app
        run: python release/build_macos.py build

      - name: Package the unsigned app (ditto keeps symlinks and permissions)
        run: python release/build_macos.py package-unsigned

      - name: Audit the unsigned package
        run: build/release-macos/venv/bin/python release/audit_macos.py dist/macos/*-macos-arm64-unsigned.zip

      - name: Smoke-test the unsigned package
        run: python release/smoke_test_macos.py dist/macos/*-macos-arm64-unsigned.zip
