<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="color-scheme" content="light dark" />
	<title>MySQL DBA Validator</title>
	<link rel="icon" type="image/svg+xml" href="/static/assets/favicon.svg" />
	<script>
		// The theme before first paint, so a saved choice never flashes the other one. The
		// only value read is one of three words under 'mdv-theme'.
		(function () {
			var t = 'system';
			try { t = localStorage.getItem('mdv-theme') || 'system'; } catch (_) { }
			var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
			document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
		})();
	</script>
</head>

<body>
	<div id="root"></div>
	<script type="module" src="/src/app/main.tsx"></script>
</body>

</html>
